name: "MCP File Server"
description: "Model Context Protocol server for file management and HA CLI commands in Home Assistant"
version: "1.6.0"
slug: "mcp_file_server"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.20
  amd64: ghcr.io/home-assistant/amd64-base:3.20
  armhf: ghcr.io/home-assistant/armhf-base:3.20
  armv7: ghcr.io/home-assistant/armv7-base:3.20
  i386: ghcr.io/home-assistant/i386-base:3.20
startup: services
boot: auto
ports:
  6789/tcp: 6789
ports_description:
  6789/tcp: MCP Server HTTP/SSE endpoint
options:
  port: 6789
  api_key: ""
  allowed_dirs:
    - "/config"
    - "/share"
    - "/addons"
  read_only: false
  max_file_size_mb: 10
  enable_ha_cli: false
  enable_backup_inspection: false
  backup_allow_content: false
  backup_max_download_mb: 128
  allowed_services:
    - "automation.reload"
    - "automation.turn_on"
    - "automation.turn_off"
    - "script.reload"
    - "template.reload"
    - "python_script.reload"
    - "homeassistant.check_config"
    - "homeassistant.reload_config_entry"
    - "homeassistant.update_entity"
    - "number.set_value"
    - "select.select_option"
schema:
  port: "int(1,65535)"
  api_key: "str?"
  allowed_dirs: [str]
  read_only: "bool"
  max_file_size_mb: "int(1,100)"
  enable_ha_cli: "bool"
  enable_backup_inspection: "bool"
  backup_allow_content: "bool"
  backup_max_download_mb: "int(1,128)"
  allowed_services: [str]
map:
  - config:rw
  - share:rw
  - addons:rw
  - ssl:ro
ingress: false
panel_icon: mdi:file-tree
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true
