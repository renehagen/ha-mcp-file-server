name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r src/requirements.txt pip-audit
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m pip_audit -r src/requirements.txt
      - run: bash -n run.sh
